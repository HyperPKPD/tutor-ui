# nginx alternative to public/.htaccess: add inside the server { } block for hyperpkpd.com
location /tutor/ {
    alias /var/www/hyperpkpd.com/tutor/;      # <- folder containing the built files
    try_files $uri $uri/ /tutor/index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    types { application/manifest+json webmanifest; }
    location ~* ^/tutor/assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location ~* ^/tutor/(sw\.js|index\.html|manifest\.webmanifest|robots\.txt|sitemap\.xml)$ { add_header Cache-Control "no-cache"; }
}
